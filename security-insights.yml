# OpenSSF Security Insights — machine-readable security posture for this project.
# Spec: https://github.com/ossf/security-insights-spec (schema v2).
# sscsb generated this valid starter. Any placeholder values sscsb leaves behind
# need real information filled in — then validate with si-tooling (`si validate`).
# `sscsb verify security-insights` reports Info until every placeholder is gone.
#
# Only the `header` + `project` blocks are emitted (both validate on their own).
# Add the optional `repository:` block (status, core-team, license, security
# posture) when you're ready to attest repository-level details.
header:
  schema-version: "2.0.0"
  last-updated: "2026-09-12"
  last-reviewed: "2026-09-12"
  url: "https://github.com/grcengineering/grcengineering.github.io/blob/main/security-insights.yml"
  comment: |
    Generated by sscs-bootstrapper. Supply-chain controls (secret scanning,
    signing, SBOM, vulnerability scanning, SLSA provenance) are enforced via the
    .sscsb config and .github/workflows installed by `sscsb init`.
project:
  name: "grcengineering/grcengineering.github.io"
  homepage: "https://github.com/grcengineering/grcengineering.github.io"
  administrators:
    - name: "Justin Pagano"
      affiliation: "GRC Engineering"
      primary: true
  repositories:
    - name: "grcengineering/grcengineering.github.io"
      comment: "Primary repository this Security Insights file is published in."
      url: "https://github.com/grcengineering/grcengineering.github.io"
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    # sscsb installs SECURITY.md; adjust if you relocate the policy.
    security-policy: "https://github.com/grcengineering/grcengineering.github.io/blob/main/SECURITY.md"
    comment: |
      Report privately via GitHub Security Advisories on this repository.
      Private vulnerability reporting is enabled; public issues are not the
      channel for security reports.
  documentation:
    detailed-guide: "https://github.com/grcengineering/grcengineering.github.io/blob/main/SECURITY.md"
