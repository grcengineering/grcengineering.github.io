# sscsb: CI secret scanning. Local hooks block first; this catches anything that
# slips past (e.g. web UI commits). All actions pinned to full commit SHAs
# (sscsb actions-audit enforces this).
#
# STRONGEST-TOOL-ONLY POLICY for this repo: TruffleHog is the sole credential
# detector. It VERIFIES a candidate against the issuing provider, so a finding is
# a live credential rather than a regex match. Gitleaks is regex-only, and
# gitleaks-action additionally requires a paid GITLEAKS_LICENSE for
# ORGANISATION-owned repositories (this repo is owned by the grcengineering org),
# so the second job would have been licence-gated noise, not added detection.
# `.sscsb/config.toml` sets [controls.secrets] gitleaks = false; `sscsb verify`
# honours that, but the workflow template does not render from it, so the gitleaks
# job is removed here by hand to keep config and CI telling the same story.
# GitHub secret scanning + push protection are also enabled on this repo.
name: Secret Scan
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout (full history for diff scanning)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Upstream README suggests @main; sscsb pins the release SHA instead (v3.95.9).
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --results=verified,unknown

